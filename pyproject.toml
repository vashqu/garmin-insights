[project]
name = "garmin-insights"
version = "0.1.0"
description = "Local Garmin + Strong analytics desktop app with science-based metrics and local LLM briefings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=17",
    "httpx>=0.27",
    "fitdecode>=0.10",
    "python-dotenv>=1.0",
    "keyring>=25",
    "ollama>=0.4",
    "pywebview>=5.3",
    "diskcache>=5.6",
    "tomli-w>=1.0",
    "garminconnect>=0.3.20",
]

[project.optional-dependencies]
forecast = ["chronos-forecasting>=1.5", "torch>=2.4"]

[project.scripts]
garmin-app = "garmin_insights.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_insights"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash -W ignore::DeprecationWarning"
